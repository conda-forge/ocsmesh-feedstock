{% set name = "ocsmesh" %}
{% set version = "3.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/4f/c1/b179aa90222dba6be2c6c78c3fbe74ed52e661710bd83a284e1cbe259877/ocsmesh-{{ version }}.tar.gz
  sha256: f72429109e1a7df0cd88433df71160a7eec323f54314aa37cf164309d6e4ae78

build:
  entry_points:
    - ocsmesh = ocsmesh.__main__:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=45
    - setuptools-scm >=7
    - wheel
    - numpy
    - pip
  run:
    - python >={{ python_min }},<3.14
    - colored-traceback <=0.3.0
    - fiona
    - geopandas >=1.0.0
    - matplotlib-base >=3.8
    - netcdf4
    - numba
    - numpy >=1.21
    - pandas
    - pyarrow
    - pyproj >=3.0
    - py-triangle
    - python-gmsh
    - rasterio
    - rtree
    - scipy
    - shapely >=2.0
    - typing-extensions
    - utm

test:
  imports:
    - ocsmesh
  commands:
    - pip check
    - ocsmesh --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/noaa-ocs-modeling/OCSMesh/
  summary: Package to generate computational unstructured meshes from planetary modeling.
  license: CC0-1.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - felicio93
    - saeed-moghimi-noaa
    - SorooshMani-NOAA
